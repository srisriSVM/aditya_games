<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aditya Games | Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d1b;color:#f5f7ff;font:16px system-ui,sans-serif;min-height:100vh}main,header,footer{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}header strong{letter-spacing:3px}header span,small{color:#8c9aba}.hero{padding:48px 32px;border:1px solid #334366;border-radius:24px;background:radial-gradient(ellipse at top right,#403577,transparent 65%),linear-gradient(135deg,#13233e,#14152a)}h1{font-size:clamp(42px,8vw,80px);line-height:1;margin:12px 0}h1 span{color:#83edff}.hero p{color:#c0cce4;max-width:540px;line-height:1.6}.tag{color:#83edff;font-weight:700;letter-spacing:3px;font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}input{background:#131b2d;border:1px solid #40506e;border-radius:10px;padding:12px;color:white;font:inherit}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}.game,.empty{background:#141d31;border:1px solid #2c3a58;border-radius:18px;padding:22px}.game{display:flex;flex-direction:column;gap:10px}.game img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}.game h3,.game p{margin:0}.game p,.empty p{color:#aab8d4}.game a{margin-top:auto;padding:12px;background:#83edff;color:#091220;text-decoration:none;font-weight:bold;border-radius:10px;text-align:center}.game a:hover{background:white}.empty{text-align:center;padding:48px 20px;grid-column:1/-1}.empty b{font-size:44px}footer{color:#8c9aba;text-align:center;font-size:13px}a:focus-visible,input:focus-visible{outline:3px solid #83edff;outline-offset:4px}
</style><script>window.GAMES = [
  {
    "title": "Ultimate Hero Simulator",
    "category": "Action / Adventure",
    "description": "Customize your hero, drop 500 feet and save the city!",
    "path": "games/ultimate-hero/",
    "image": "games/ultimate-hero/cover.svg"
  },
  {
    "title": "Formula Infinity 3D",
    "category": "Racing / Simulation",
    "description": "Spray paint your F1 car, race through city curves, drift, jump and boost in first-person or chase view.",
    "path": "games/formula-infinity/?v=cockpit",
    "image": "games/formula-infinity/cover.svg"
  }
];
</script></head><body><header><strong>◈ ADITYA GAMES</strong><span>MY ARCADE</span></header><main><section class="hero"><div class="tag">BUILD · PLAY · EXPLORE</div><h1>Game <span>Arcade.</span></h1><p>Welcome to my game universe. Discover new worlds, take on challenges and play original games.</p><small id="count" aria-live="polite"></small></section><div class="toolbar"><h2>All games</h2><input id="search" type="search" placeholder="Search games…" aria-label="Search games"></div><div id="games" aria-live="polite"></div></main><footer>ADITYA GAMES · Made for fun</footer><script>
window.addEventListener('DOMContentLoaded',()=>{const catalog=window.GAMES||[],grid=document.getElementById('games'),search=document.getElementById('search');document.getElementById('count').textContent=catalog.length+' games available';function render(){grid.replaceChildren();const q=search.value.toLowerCase().trim();const items=catalog.filter(g=>[g.title,g.description,g.category].join(' ').toLowerCase().includes(q));if(!items.length){const div=document.createElement('div');div.className='empty';const icon=document.createElement('b');icon.textContent='🎮';const h=document.createElement('h3');h.textContent=catalog.length?'No matching games':'Your first game is coming!';const p=document.createElement('p');p.textContent=catalog.length?'Try another search.':'New games will appear here as they are added to the arcade.';div.append(icon,h,p);grid.append(div);return}for(const g of items){const card=document.createElement('article');card.className='game';if(g.image){const img=document.createElement('img');img.src=g.image;img.alt='';img.loading='lazy';card.append(img)}const category=document.createElement('small');category.textContent=g.category||'Game';const h=document.createElement('h3');h.textContent=g.title;const p=document.createElement('p');p.textContent=g.description||'';const a=document.createElement('a');a.href=g.path;a.textContent='Play game →';card.append(category,h,p,a);grid.append(card)}}search.addEventListener('input',render);render()});
</script></body></html>
