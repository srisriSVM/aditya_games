</style></head><body><main><a href="../../">← Arcade</a><h1>GODZILLA: <span style="color:#74e3ff">CITY SHOWDOWN 3D</span></h1><div id="hud">Loading…</div><div id="view"><div id="overlay"><div><h2 id="heading">City Showdown</h2><p id="story">Become Godzilla in an evacuated city. Smash buildings, then switch sides and defend the city from the giant monster.</p><button id="start" disabled>Start rampage</button></div></div></div><div id="message">Loading 3D engine…</div><div id="weapons" hidden><button data-weapon="0">1 · RPG</button><button data-weapon="1">2 · Minigun</button><button data-weapon="2">3 · Plasma cannon</button><button data-weapon="3">4 · Freeze blaster</button></div><div id="controls"><button data-key="ArrowUp">Forward</button><button data-key="ArrowLeft">Left</button><button data-key="ArrowDown">Back</button><button data-key="ArrowRight">Right</button><button data-key="w">Look up</button><button data-key="a">Look left</button><button data-key="s">Look down</button><button data-key="d">Look right</button><button data-key=" ">Attack / Fire</button><button data-key="e" id="stomp">Stomp</button><button id="switch" hidden>Start defense</button><button id="restart">Restart</button></div><small id="help">Arrow keys: move · WASD: camera · Space: atomic beam · E: stomp · Drag view: orbit camera</small></main><script type="module">

function rampage(){reset();mode='rampage';defender.visible=false;$('overlay').hidden=true;$('weapons').hidden=true;$('stomp').hidden=false;$('switch').hidden=true;$('message').textContent='Rampage: destroy 10 empty buildings to unlock defense!';$('help').textContent='Arrow keys: move · WASD: camera · Space: atomic beam · E: stomp · Drag view: orbit camera'}

function norm(k){return k.startsWith('Arrow')?k:k.toLowerCase()}window.addEventListener('keydown',e=>{const k=norm(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' ','e','1','2','3','4'].includes(k)&&mode!=='menu'){e.preventDefault();keys.add(k);if(mode==='defense'&&/^[1-4]$/.test(k))choose(Number(k)-1)}});window.addEventListener('keyup',e=>keys.delete(norm(e.key)));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
