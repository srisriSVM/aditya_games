window.addEventListener('keydown',e=>{if(state!=='race')return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d','c','v',' '].includes(k)){e.preventDefault();keys.add(k);if(k==='c')$('center').click();if(k==='v'&&!e.repeat)cameraMode()}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
let last=performance.now();const clamp=T.MathUtils.clamp;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(state==='garage'){if(!painting)player.rotation.y+=dt*.45;renderer.render(scene,camera);return}
const dir=Number(keys.has('ArrowLeft'))-Number(keys.has('ArrowRight'));steer=T.MathUtils.lerp(steer,dir,dt*6);const pressed=keys.has(" ");if(pressed&&!nitroHeld&&boost<=0&&recharge<=0)boost=5;nitroHeld=pressed;const boosting=boost>0;padTime=Math.max(0,padTime-dt);if(boosting){boost=Math.max(0,boost-dt);if(boost===0)recharge=10}else recharge=Math.max(0,recharge-dt);flame.visible=boosting||padTime>0;flame.scale.z=1+Math.sin(now*.04)*.18;speed=clamp(speed+dt*(keys.has("ArrowDown")?-42:(boosting||padTime>0)?48:keys.has("ArrowUp")?24:3),0,(boosting||padTime>0)?125:92);const drift=(slope(distance+speed*dt)-slope(distance))*speed*.13;curveOffset=clamp(curveOffset+steer*dt*(3+speed*.085)-drift,-7,7);if(Math.abs(curveOffset)>6.8)speed=Math.max(0,speed-dt*12);const oldD=distance;distance+=speed*dt;const heading=Math.atan(slope(distance));const pp=roadPoint(distance,curveOffset);player.position.set(pp[0],0,pp[1]);player.rotation.y=heading+steer*.16;player.userData.front.forEach(w=>w.rotation.y=steer*.3);
updateRoad();featureUpdate(oldD,dt);smokeUpdate(dt);updateMonster(oldD,dt,now);
hit=Math.max(0,hit-dt);for(const a of ai){const prev=a.z;a.speed=clamp(a.speed+Math.sin(now*.0006+a.phase)*dt*4,28,80);a.z+=(a.speed-speed)*dt;const target=Math.sin(now*.00035+a.phase)*5.2;a.x=T.MathUtils.lerp(a.x,target,dt*.45);if(prev>=0&&a.z<0)passed++;if(a.z< -38){a.z=130+Math.random()*140;a.x=(Math.random()-.5)*10;a.speed=30+Math.random()*40}if(a.z>320){a.z=65+Math.random()*110;a.x=(Math.random()-.5)*10;a.speed=32+Math.random()*35}if(Math.abs(a.z)<3.2&&Math.abs(a.x-curveOffset)<1.8&&hit===0&&air<1){speed*=.64;hit=1;a.z+=4;$('message').textContent='Contact! Keep racing.'}const ap=roadPoint(distance+a.z,a.x);a.o.position.set(ap[0],0,ap[1]);a.o.rotation.y=Math.atan(slope(distance+a.z))}
if(hit===0)$('message').textContent=ghostMessage>0?'GHOST PASSED! Keep racing!':monster.visible&&nextMonster>distance?'GHOST MONSTER AHEAD — DRIVE THROUGH IT!':air>0?'AIRBORNE!':padTime>0?'YELLOW BOOST PAD!':boosting?'NITRO BOOST ACTIVATED!':recharge>0?'Nitro recharging: '+recharge.toFixed(1)+' s':'Nitro ready — press SPACE!';camera.fov=T.MathUtils.lerp(camera.fov,firstPerson?((boosting||padTime>0)?92:80):((boosting||padTime>0)?78:65),dt*5);camera.updateProjectionMatrix();yaw=clamp(yaw+dt*(Number(keys.has('a'))-Number(keys.has('d')))*1.6,-Math.PI,Math.PI);pitch=clamp(pitch+dt*(Number(keys.has('w'))-Number(keys.has('s')))*.9,-.65,.9);const p=player.position;cockpitWheel.visible=firstPerson;cockpitWheel.rotation.z=-steer*.65;const angle=firstPerson?player.rotation.y:heading;if(firstPerson){player.updateMatrixWorld(true);camera.position.copy(player.localToWorld(new T.Vector3(0,1.03,.22)));}else camera.position.set(p.x-Math.sin(heading)*6.8,3.1+p.y*.65,p.z-Math.cos(heading)*6.8);const lookPitch=pitch+(firstPerson?-player.rotation.x-.065:-.11);const forward=new T.Vector3(Math.sin(yaw+angle)*Math.cos(lookPitch),Math.sin(lookPitch),Math.cos(yaw+angle)*Math.cos(lookPitch));camera.lookAt(camera.position.clone().addScaledVector(forward,20));$('hud').textContent=Math.round(speed*3.6)+' km/h  |  '+(distance/1000).toFixed(2)+' km  |  Ghosts: '+ghostCount+'  |  Overtakes: '+passed+'  |  '+(firstPerson?'COCKPIT':'CHASE')+'  |  8 AI racers  |  ⚡ '+(boosting?boost.toFixed(1)+' s boost':recharge>0?recharge.toFixed(1)+' s recharge':'READY');renderer.render(scene,camera)}requestAnimationFrame(frame);
}catch(e){$('message').textContent='The 3D engine could not load. Check internet and WebGL support, then reload.';console.error(e)}
