<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Infinity 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e1c;color:#eff5ff;font:16px system-ui}main{max-width:1250px;margin:auto;padding:16px}a{color:#86efff}h1{margin:8px 0;font-size:clamp(24px,4vw,40px);font-style:italic}#layout{display:flex;gap:16px}#garage{width:290px;flex-shrink:0;background:#162138;padding:18px;border-radius:14px}#stage{flex:1;min-width:0}#view{height:clamp(350px,65vh,690px);border-radius:12px;overflow:hidden;background:#14223b;touch-action:none}canvas{display:block}button,input,select{font:inherit}button,select{padding:10px;background:#233956;color:white;border:1px solid #567091;border-radius:8px;cursor:pointer}button:hover,#race{background:#83efff;color:#10182b}label{display:block;margin:12px 0}#hud{padding:10px 0;display:flex;gap:15px;flex-wrap:wrap;font-weight:bold;font-variant-numeric:tabular-nums}#message{color:#86efff}#controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}#controls button{touch-action:none;user-select:none}small{color:#bac8dd}[hidden]{display:none!important}@media(max-width:750px){#layout{flex-direction:column}#garage,#stage{width:100%}}
</style></head><body><main><a href="../../">← Arcade</a><h1>FORMULA <span style="color:#83efff">INFINITY</span> 3D</h1><div id="layout"><section id="garage"><h2>Paint garage</h2><p>Pick a spray color, then drag over the rotating car to paint individual panels.</p><label>Spray color <input id="paint" type="color" value="#ff303b"></label><label>Wing and trim <input id="trim" type="color" value="#f6e9e9"></label><button id="all">Spray entire body</button> <button id="reset">Reset paint</button><label>Car number <input id="num" type="number" min="1" max="99" value="7" style="width:65px"></label><button id="race">START ENDLESS RACE</button></section><section id="stage"><div id="hud">CUSTOM F1 GARAGE</div><div id="view"></div><p id="message">Loading 3D engine…</p><div id="controls" hidden><button data-key="ArrowLeft">Steer ◀</button><button data-key="ArrowRight">Steer ▶</button><button data-key="ArrowUp">Gas ▲</button><button data-key="ArrowDown">Brake ▼</button><button data-key="a">Look ←</button><button data-key="d">Look →</button><button data-key="w">Look ↑</button><button data-key="s">Look ↓</button><button id="center">Center camera</button><button id="back">Garage</button></div><small id="help">Spray the body panels to create your own racing livery.</small></section></div></main><script type="module">
const $=id=>document.getElementById(id);
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const scene=new T.Scene(),camera=new T.PerspectiveCamera(65,1,.1,650),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;$('view').append(renderer.domElement);new ResizeObserver(()=>{const w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe($('view'));scene.add(new T.HemisphereLight(0xe7f6ff,0x52634d,2.1));const sun=new T.DirectionalLight(0xffebd2,2.3);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-35,right:35,top:40,bottom:-40,far:160});scene.add(sun);
const mat=(c,m=.1,r=.6)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});const rubber=mat(0x171a20),metal=mat(0x444b56,.7),black=mat(0x101722),glass=mat(0x293c54,.5,.2);function mesh(p,g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function box(p,m,x,y,z,w,h,d){return mesh(p,new T.BoxGeometry(w,h,d),m,x,y,z)}function bodyShape(w1,w2,len,height){const s=new T.Shape();s.moveTo(-w1/2,-len/2);s.lineTo(w1/2,-len/2);s.lineTo(w2/2,len/2);s.lineTo(-w2/2,len/2);s.closePath();const g=new T.ExtrudeGeometry(s,{depth:height,bevelEnabled:true,bevelThickness:.035,bevelSize:.035,bevelSegments:1,steps:1});g.rotateX(-Math.PI/2);return g}
function car(color,trimColor,own=false){const group=new T.Group(),panels=[],trims=[],wheels=[],front=[];const panel=(g,x,y,z)=>{const o=mesh(group,g,mat(color,.55,.28),x,y,z);panels.push(o);return o};const trim=(x,y,z,w,h,d)=>{const o=box(group,mat(trimColor,.4,.32),x,y,z,w,h,d);trims.push(o);return o};panel(bodyShape(.24,.68,2.25,.22),0,.28,.85);panel(new T.BoxGeometry(.78,.36,1.5),0,.29,-.6);for(const s of [-1,1]){panel(new T.BoxGeometry(.52,.38,1.35),s*.49,.27,-.45);trim(s*.48,.48,-.45,.44,.035,1.15)}trim(0,.22,1.94,1.95,.12,.45);trim(0,.83,-1.65,1.95,.13,.5);for(const s of [-1,1]){trim(s*.88,.67,-1.65,.12,.44,.52);box(group,black,s*.42,.46,-1.52,.1,.65,.14);box(group,metal,s*.58,.27,1.25,.8,.08,.09);box(group,metal,s*.58,.28,-1.18,.8,.08,.09);for(const z of [1.2,-1.16]){const pivot=new T.Group();pivot.position.set(s*.94,.34,z);group.add(pivot);const tire=mesh(pivot,new T.CylinderGeometry(.34,.34,.31,24),rubber,0,0,0);tire.rotation.z=Math.PI/2;const hub=mesh(pivot,new T.CylinderGeometry(.17,.17,.325,16),metal,0,0,0);hub.rotation.z=Math.PI/2;wheels.push(pivot);if(z>0)front.push(pivot)}}box(group,black,0,.54,.1,.51,.12,.67);mesh(group,new T.SphereGeometry(.18,16,12),mat(0xf5e3bc),0,.76,.05);const halo=mesh(group,new T.TorusGeometry(.28,.045,8,22),metal,0,.79,.10);halo.rotation.x=Math.PI/2;box(group,metal,0,.66,.42,.07,.32,.07);if(own){const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');const tex=new T.CanvasTexture(cv);const badge=mesh(group,new T.PlaneGeometry(.40,.40),new T.MeshBasicMaterial({map:tex,transparent:true}),0,.535,.79);badge.rotation.x=-Math.PI/2;group.userData.number=()=>{c.clearRect(0,0,128,128);c.fillStyle='white';c.fillRect(8,8,112,112);c.fillStyle='#111';c.font='bold 80px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(Math.max(1,Math.min(99,Number($('num').value)||7))),64,68);tex.needsUpdate=true};group.userData.number()}group.userData.panels=panels;group.userData.trims=trims;group.userData.front=front;return group}
const player=car('#ff303b','#f6e9e9',true);scene.add(player);const lab=new T.Group();scene.add(lab);mesh(lab,new T.CylinderGeometry(3.5,3.5,.3,48),mat(0x34455e,.5),0,-.15,0);const ring=mesh(lab,new T.TorusGeometry(3.2,.045,8,64),new T.MeshBasicMaterial({color:0x83efff}),0,.015,0);ring.rotation.x=Math.PI/2;
const track=new T.Group();scene.add(track);const asphalt=mat(0x343941),grass=mat(0x477748),white=mat(0xe9edf1),red=mat(0xb8323c),rail=mat(0x9baaba,.5),trunk=mat(0x68503c),leaf=mat(0x275b40);const chunks=[],L=60,N=12;for(let i=0;i<N;i++){const g=new T.Group();track.add(g);chunks.push(g);box(g,grass,0,-.2,0,100,.35,L);box(g,asphalt,0,0,0,16,.08,L);for(const s of [-1,1]){box(g,white,s*7.65,.06,0,.12,.03,L);box(g,rail,s*9.1,.48,0,.16,.28,L);for(let k=0;k<12;k++)box(g,k%2?red:white,s*8.05,.07,k*5-27.5,.8,.08,5);for(let k=0;k<4;k++){const x=s*(15+((i*11+k*7)%17)),z=k*15-22;mesh(g,new T.CylinderGeometry(.18,.25,2.4,6),trunk,x,1.2,z);mesh(g,new T.ConeGeometry(1.6,4.8,7),leaf,x,3.6,z)}}for(let k=0;k<6;k++)box(g,white,0,.06,k*10-25,.12,.02,3)}
const ai=[],palette=['#2166ed','#ffd02f','#1fbb9d','#e8e8ef','#a443df','#ff7d25','#2d405b','#fd70a2'];for(let i=0;i<8;i++){const o=car(palette[i],'#e7e7e7');scene.add(o);ai.push({o,x:(i%3-1)*4,z:18+i*13,speed:33+i*2,phase:i*1.3})}
let state='garage',speed=0,distance=0,passed=0,yaw=0,pitch=0,steer=0,hit=0,painting=false;const keys=new Set(),ray=new T.Raycaster(),pointer=new T.Vector2();function spray(e){if(state!=='garage'||!painting)return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(player.userData.panels,false);if(hits.length)hits[0].object.material.color.set($('paint').value)}
renderer.domElement.onpointerdown=e=>{if(state==='garage'){painting=true;renderer.domElement.setPointerCapture(e.pointerId);spray(e)}};renderer.domElement.onpointermove=spray;renderer.domElement.onpointerup=renderer.domElement.onpointercancel=renderer.domElement.onlostpointercapture=()=>painting=false;$('all').onclick=()=>player.userData.panels.forEach(p=>p.material.color.set($('paint').value));$('trim').oninput=()=>player.userData.trims.forEach(p=>p.material.color.set($('trim').value));$('reset').onclick=()=>{$('paint').value='#ff303b';$('trim').value='#f6e9e9';$('all').click();$('trim').oninput()};$('num').oninput=player.userData.number;
function garage(){state='garage';keys.clear();painting=false;track.visible=false;lab.visible=true;ai.forEach(a=>a.o.visible=false);player.position.set(0,0,0);player.rotation.set(0,0,0);scene.background=new T.Color(0x101c31);scene.fog=null;camera.position.set(5,3.8,6);camera.lookAt(0,.45,0);$('garage').hidden=false;$('controls').hidden=true;$('hud').textContent='CUSTOM F1 GARAGE';$('message').textContent='Spray paint your car, then start racing.';$('help').textContent='Drag the spray brush across individual body panels.'}garage();
$('race').onclick=()=>{state='race';keys.clear();painting=false;speed=30;distance=0;passed=0;yaw=0;pitch=0;steer=0;hit=0;player.position.set(0,0,0);player.rotation.set(0,0,0);track.visible=true;lab.visible=false;ai.forEach((a,i)=>{a.o.visible=true;a.x=(i%3-1)*4;a.z=18+i*13;a.speed=33+i*2});scene.background=new T.Color(0xa5cce7);scene.fog=new T.Fog(0xa5cce7,100,410);$('garage').hidden=true;$('controls').hidden=false;$('message').textContent='Endless race started! Overtake the AI drivers.';$('help').textContent='Arrow keys: steer, gas, brake • WASD: look around • C: center camera';camera.position.set(0,3.3,-7);camera.lookAt(0,1,8)};$('back').onclick=garage;$('center').onclick=()=>{yaw=0;pitch=0};
window.addEventListener('keydown',e=>{if(state!=='race')return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d','c'].includes(k)){e.preventDefault();keys.add(k);if(k==='c')$('center').click()}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
let last=performance.now();const clamp=T.MathUtils.clamp;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(state==='garage'){if(!painting)player.rotation.y+=dt*.45;renderer.render(scene,camera);return}
const dir=Number(keys.has('ArrowLeft'))-Number(keys.has('ArrowRight'));steer=T.MathUtils.lerp(steer,dir,dt*6);speed=clamp(speed+dt*(keys.has('ArrowDown')?-42:keys.has('ArrowUp')?24:3),0,92);const oldX=player.position.x;player.position.x=clamp(oldX+steer*dt*(3+speed*.085),-7,7);if(Math.abs(player.position.x)>6.8)speed=Math.max(0,speed-dt*12);player.rotation.y=steer*.16;player.userData.front.forEach(w=>w.rotation.y=steer*.3);distance+=speed*dt;
const offset=distance%L;chunks.forEach((g,i)=>g.position.z=(i-2)*L-offset);
hit=Math.max(0,hit-dt);for(const a of ai){const prev=a.z;a.speed=clamp(a.speed+Math.sin(now*.0006+a.phase)*dt*4,28,80);a.z+=(a.speed-speed)*dt;const target=Math.sin(now*.00035+a.phase)*5.2;a.x=T.MathUtils.lerp(a.x,target,dt*.45);if(prev>=0&&a.z<0)passed++;if(a.z< -38){a.z=130+Math.random()*140;a.x=(Math.random()-.5)*10;a.speed=30+Math.random()*40}if(a.z>320){a.z=65+Math.random()*110;a.x=(Math.random()-.5)*10;a.speed=32+Math.random()*35}if(Math.abs(a.z)<3.2&&Math.abs(a.x-player.position.x)<1.8&&hit===0){speed*=.64;hit=1;a.z+=4;$('message').textContent='Contact! Keep racing.'}a.o.position.set(a.x,0,a.z);a.o.rotation.y=0}
if(hit===0)$('message').textContent='Endless race · keep overtaking!';yaw=clamp(yaw+dt*(Number(keys.has('a'))-Number(keys.has('d')))*1.6,-Math.PI,Math.PI);pitch=clamp(pitch+dt*(Number(keys.has('w'))-Number(keys.has('s')))*.9,-.65,.9);const p=player.position;camera.position.set(p.x,3.1,-6.8);const forward=new T.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));camera.lookAt(camera.position.clone().addScaledVector(forward,20));$('hud').textContent=Math.round(speed*3.6)+' km/h  |  '+(distance/1000).toFixed(2)+' km  |  Overtakes: '+passed+'  |  8 AI racers';renderer.render(scene,camera)}requestAnimationFrame(frame);
}catch(e){$('message').textContent='The 3D engine could not load. Check internet and WebGL support, then reload.';console.error(e)}
</script></body></html>
