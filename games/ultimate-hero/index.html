<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultimate Hero Simulator</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e1d;color:#fff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:20px}a{color:#80eaff}h1{margin:12px 0}button,select,input{font:inherit}button,select{background:#24334e;color:white;border:1px solid #536d98;border-radius:9px;padding:10px;cursor:pointer}button:hover,button.active{background:#146c91}#start{background:#80eaff;color:#071321;font-weight:bold}#workshop{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#142038;padding:20px;border-radius:18px}#heroes{display:flex;flex-wrap:wrap;gap:8px}label{display:block;margin:12px 0}canvas{width:100%;height:auto;display:block;background:#0e1a30;border-radius:14px;touch-action:none}#preview{max-height:370px;object-fit:contain}#hud{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0;font-weight:bold}#controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}#controls button{min-width:60px;touch-action:none;user-select:none}#message{color:#80eaff;font-weight:bold;min-height:25px}small{color:#abbad3}[hidden]{display:none!important}@media(max-width:680px){#workshop{grid-template-columns:1fr}}
</style></head><body><main><a href="../../">← Arcade</a><h1>ULTIMATE HERO SIMULATOR</h1><p>Build your hero. Drop into the city. Stop the villains.</p><section id="workshop"><div><h2>Hero workshop</h2><div id="heroes"></div><div id="armor"><label>Armor color <input id="primary" type="color" value="#bc1934"></label><label>Trim color <input id="trim" type="color" value="#ffc345"></label><label>Helmet <select id="helmet"><option>Classic</option><option>Stealth</option><option>Heavy</option></select></label><label>Chest armor <select id="chest"><option>Arc reactor</option><option>Triangular core</option><option>Heavy shield</option></select></label><label>Thrusters <select id="thruster"><option>Standard</option><option>Turbo</option></select></label></div><p id="power"></p><button id="start">Launch from 500 ft</button></div><canvas id="preview" width="400" height="370"></canvas></section><section id="play" hidden><div id="hud"><span id="phase"></span><span id="health"></span><span id="score"></span><span id="remaining"></span></div><canvas id="world" width="900" height="540"></canvas><p id="message" aria-live="polite"></p><small>WASD / arrows to move • Space to attack • During descent, steer and hold Space to slow down.</small><div id="controls"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key=" ">POWER</button><button id="restart">Workshop</button></div></section></main><script>
const $=id=>document.getElementById(id), heroes=[{name:'Iron Man',color:'#bc1934',trim:'#ffc345',power:'Repulsor blast',range:145,damage:2},{name:'Spider-Man',color:'#d62d46',trim:'#275cb9',power:'Web strike',range:115,damage:2},{name:'Black Panther',color:'#292638',trim:'#aa81ff',power:'Vibranium claws',range:62,damage:3},{name:'Captain America',color:'#244eaa',trim:'#e8424b',power:'Shield throw',range:130,damage:2},{name:'Hulk',color:'#59b94d',trim:'#7942ae',power:'Hulk smash',range:85,damage:4}];let hero=heroes[0],state='workshop',keys=new Set(),alt=500,x=450,y=270,hp=100,score=0,enemies=[],last=0,cool=0,flash=0,landing=0;const preview=$('preview').getContext('2d'),ctx=$('world').getContext('2d');
function colors(){return hero===heroes[0]?[$('primary').value,$('trim').value]:[hero.color,hero.trim]}
function suit(c,x,y,s){const [a,b]=colors();c.save();c.translate(x,y);c.scale(s,s);c.lineJoin='round';c.strokeStyle='#080c16';c.lineWidth=2;function poly(points,fill){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill();c.stroke()}let wide=hero.name==='Hulk'?1.2:1;c.scale(wide,1);poly([[-15,-18],[-29,-13],[-34,18],[-25,22],[-17,0]],a);poly([[15,-18],[29,-13],[34,18],[25,22],[17,0]],a);poly([[-17,13],[-3,14],[-4,47],[-17,49],[-20,39]],a);poly([[17,13],[3,14],[4,47],[17,49],[20,39]],a);poly([[-19,-19],[19,-19],[15,18],[-15,18]],a);poly([[-14,-47],[14,-47],[17,-29],[10,-20],[-10,-20],[-17,-29]],a);poly([[-11,-42],[11,-42],[12,-31],[7,-25],[-7,-25],[-12,-31]],b);c.fillStyle='#e1fbff';c.fillRect(-10,-35,7,3);c.fillRect(3,-35,7,3);c.fillStyle=b;c.fillRect(-14,4,28,6);c.fillRect(-15,38,10,8);c.fillRect(5,38,10,8);c.fillStyle='#a9f8ff';c.beginPath();if(hero===heroes[0]&&$('chest').selectedIndex===1){c.moveTo(0,-12);c.lineTo(8,1);c.lineTo(-8,1);c.closePath()}else c.arc(0,-5,hero===heroes[0]&&$('chest').selectedIndex===2?9:5,0,Math.PI*2);c.fill();if(hero===heroes[0]&&$('helmet').selectedIndex){c.fillStyle=a;c.fillRect(-18,-46,5,20);c.fillRect(13,-46,5,20);if($('helmet').selectedIndex===2)c.fillRect(-19,-48,38,6)}if(hero.name==='Captain America'){c.fillStyle='#e8424b';c.beginPath();c.arc(-30,8,15,0,7);c.fill();c.strokeStyle='#fff';c.stroke();c.fillStyle='#244eaa';c.beginPath();c.arc(-30,8,8,0,7);c.fill()}c.restore()}
function drawPreview(){preview.fillStyle='#0d172a';preview.fillRect(0,0,400,370);preview.strokeStyle='#253c58';for(let i=0;i<400;i+=25){preview.beginPath();preview.moveTo(i,0);preview.lineTo(i,370);preview.stroke()}preview.fillStyle='#567c9e';preview.fillRect(100,330,200,6);suit(preview,200,185,2.8);preview.fillStyle='white';preview.font='bold 18px system-ui';preview.textAlign='center';preview.fillText(hero.name,200,30)}
heroes.forEach(h=>{const b=document.createElement('button');b.textContent=h.name;b.onclick=()=>{hero=h;document.querySelectorAll('#heroes button').forEach(v=>v.classList.toggle('active',v===b));$('armor').hidden=h!==heroes[0];$('power').textContent='Special power: '+h.power;drawPreview()};$('heroes').append(b)});$('heroes').firstChild.click();$('armor').addEventListener('input',drawPreview);
function start(){state='drop';alt=500;x=450;y=270;hp=100;score=0;cool=0;flash=0;landing=0;keys.clear();enemies=[];$('workshop').hidden=true;$('play').hidden=false;$('message').textContent='Steer toward the city. Hold POWER to slow your fall.'} $('start').onclick=start;$('restart').onclick=()=>{state='workshop';keys.clear();$('play').hidden=true;$('workshop').hidden=false};
function key(k){return keys.has(k)}window.addEventListener('keydown',e=>{if(state==='workshop')return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys.add(e.key.length===1?e.key.toLowerCase():e.key)});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
function spawn(){enemies=Array.from({length:12},(_,i)=>({x:55+(i%6)*155,y:i<6?60:480,hp:4+Math.floor(i/6),hit:0}))}
function city(){ctx.fillStyle='#253445';ctx.fillRect(0,0,900,540);for(let i=0;i<900;i+=180){for(let j=0;j<540;j+=180){ctx.fillStyle='#526174';ctx.fillRect(i+8,j+8,112,110);ctx.fillStyle='#34475d';ctx.fillRect(i+13,j+13,102,100);ctx.strokeStyle='#6b8498';ctx.strokeRect(i+18,j+18,92,90);ctx.fillStyle='#86bad4';for(let k=0;k<4;k++)ctx.fillRect(i+25+k*20,j+25,10,7)}ctx.strokeStyle='#b4a77b';ctx.setLineDash([12,14]);ctx.beginPath();ctx.moveTo(i+150,0);ctx.lineTo(i+150,540);ctx.stroke()}for(let j=150;j<540;j+=180){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(900,j);ctx.stroke()}ctx.setLineDash([])}
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000||0,.04);last=t;if(state==='workshop')return;const dx=Number(key('ArrowRight')||key('d'))-Number(key('ArrowLeft')||key('a')),dy=Number(key('ArrowDown')||key('s'))-Number(key('ArrowUp')||key('w'));if(state==='drop'||state==='battle'){x=Math.max(25,Math.min(875,x+dx*200*dt));y=Math.max(30,Math.min(510,y+dy*200*dt))}
if(state==='drop'){alt=Math.max(0,alt-dt*(key(' ')?(hero===heroes[0]&&$('thruster').selectedIndex?32:48):100));city();ctx.fillStyle='rgba(120,190,240,'+(alt/800)+')';ctx.fillRect(0,0,900,540);ctx.fillStyle='#ffffff55';for(let i=0;i<18;i++){let xx=(i*83+t*.05)%900;ctx.fillRect(xx,(i*53+t*.2)%540,3,35)}suit(ctx,x,y,.6+alt/650);if(alt===0){state='battle';landing=1;spawn();$('message').textContent='Superhero landing! Defeat all 12 villains.'}}
else{city();cool=Math.max(0,cool-dt);flash=Math.max(0,flash-dt);landing=Math.max(0,landing-dt);if(state==='battle'){if(key(' ')&&cool===0){cool=.48;flash=.2;for(const e of enemies){if(Math.hypot(e.x-x,e.y-y)<hero.range){e.hp-=hero.damage;e.hit=.16}}const before=enemies.length;enemies=enemies.filter(e=>e.hp>0);score+=(before-enemies.length)*100}for(const e of enemies){const d=Math.hypot(x-e.x,y-e.y)||1;if(d>24){e.x+=(x-e.x)/d*55*dt;e.y+=(y-e.y)/d*55*dt}else hp-=8*dt;e.hit=Math.max(0,e.hit-dt)}if(hp<=0){hp=0;state='lost';$('message').textContent='Mission failed. Return to the workshop and try again.'}else if(!enemies.length){state='won';$('message').textContent='MISSION COMPLETE! You saved the city!'}}
for(const e of enemies){ctx.fillStyle=e.hit?'#fff':'#913b71';ctx.fillRect(e.x-12,e.y-14,24,28);ctx.fillStyle='#f9b7ff';ctx.fillRect(e.x-8,e.y-7,5,4);ctx.fillRect(e.x+3,e.y-7,5,4);ctx.fillStyle='#e55b6a';ctx.fillRect(e.x-12,e.y-21,e.hp*5,3)}if(flash||landing){ctx.strokeStyle=landing?'#ffd26a':'#9df8ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,landing?120*(1-landing)+20:hero.range*(1-flash/.3),0,7);ctx.stroke()}suit(ctx,x,y,.65);if(state==='won'||state==='lost'){ctx.fillStyle='#08101dcc';ctx.fillRect(0,210,900,120);ctx.fillStyle='white';ctx.font='bold 38px system-ui';ctx.textAlign='center';ctx.fillText(state==='won'?'CITY SAVED!':'TRY AGAIN',450,280)}}
$('phase').textContent=state==='drop'?'Altitude: '+Math.ceil(alt)+' ft':'City battle';$('health').textContent='Health: '+Math.ceil(hp)+'%';$('score').textContent='Score: '+score;$('remaining').textContent=state==='drop'?'':'Villains: '+enemies.length}
requestAnimationFrame(loop);
</script></body></html>
