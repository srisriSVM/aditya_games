</style></head><body><main><a href="../../">← Arcade</a><h1>ULTIMATE HERO SIMULATOR <span style="color:#8aefff">3D</span></h1><div id="layout"><section id="workshop"><h2>Hero workshop</h2><div id="heroes"></div><div id="armor"><label>Armor <input type="color" id="primary" value="#b92135"></label><label>Trim <input type="color" id="trim" value="#ffc345"></label><label>Helmet <select id="helmet"><option>Classic</option><option>Stealth</option><option>Heavy</option></select></label><label>Chest <select id="chest"><option>Arc reactor</option><option>Triangle core</option><option>Heavy plate</option></select></label><label>Thrusters <select id="thruster"><option>Standard</option><option>Turbo</option></select></label></div><p id="power"></p><button id="launch">Launch from 500 ft</button></section><section id="stage"><div id="hud"></div><div id="view"></div><p id="message">Loading 3D engine…</p><div id="controls" hidden><button data-key="a">◀</button><button data-key="w">▲</button><button data-key="s">▼</button><button data-key="d">▶</button><button data-key=" ">POWER</button><button data-key="f">FLY</button><button id="back">Workshop</button></div><small id="help">Choose a hero and customize your armor.</small></section></div></main><script type="module">

const city=new T.Group(), lab=new T.Group();scene.add(city,lab);const mat=(color,metalness=.1,roughness=.55)=>new T.MeshStandardMaterial({color,metalness,roughness});function mesh(g,m,parent,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(p,m,x,y,z,w,h,d){return mesh(new T.BoxGeometry(w,h,d),m,p,x,y,z)}

heroes.forEach(h=>{const button=document.createElement('button');button.textContent=h.name;button.onclick=()=>{hero=h;document.querySelectorAll('#heroes button').forEach(b=>b.classList.toggle('active',b===button));$('armor').hidden=h!==heroes[0];$('power').textContent='Power: '+h.power;makeHero()};$('heroes').append(button)});$('heroes').firstChild.click();$('armor').addEventListener('input',makeHero);
function clearBattle(){for(const e of enemies)scene.remove(e.obj);enemies=[];for(const e of effects)scene.remove(e.obj);effects.length=0}
function workshop(){clearBattle();state='workshop';keys.clear();city.visible=false;lab.visible=true;scene.fog=null;scene.background=new T.Color(0x101d32);$('workshop').hidden=false;$('controls').hidden=true;$('message').textContent='Customize your hero, then launch.';$('help').textContent='Choose a hero and customize your armor.';makeHero();$('hud').textContent='ARMOR DESIGN LAB';camera.position.set(4,3.3,6);camera.lookAt(0,1.3,0)}workshop();
function spawn(){for(let i=0;i<12;i++){const obj=new T.Group();scene.add(obj);const red=mat(0x743654),black=mat(0x252433);box(obj,red,0,1.05,0,.9,1,.65);box(obj,black,0,1.8,0,.6,.5,.55);for(const s of [-1,1]){box(obj,red,s*.63,1.05,0,.35,.8,.35);box(obj,black,s*.24,.35,0,.34,.65,.4);box(obj,new T.MeshBasicMaterial({color:0xff538b}),s*.13,1.84,.29,.15,.08,.04)}obj.position.set(i<6?(i-3)*10:((i-6)-3)*10,0,i<6?-28:28);enemies.push({obj,hp:4+(i>=6?1:0)})}}
$('launch').onclick=()=>{clearBattle();state='drop';alt=152.4;hp=100;score=0;cool=0;flight=false;heading=0;keys.clear();city.visible=true;lab.visible=false;scene.background=new T.Color(0x95b9d6);scene.fog=new T.Fog(0x95b9d6,100,320);player.position.set(0,alt,0);player.rotation.y=0;camera.position.set(0,alt+7,-15);$('workshop').hidden=true;$('controls').hidden=false;$('message').textContent='500-foot drop! Hold POWER to brake.';$('help').textContent='WASD / arrows: move · Space: power · F: Iron Man flight';};
$('back').onclick=workshop;function normalize(k){return ({ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'})[k]||k.toLowerCase()}function down(k){if(k==='f'&&!keys.has(k)&&hero===heroes[0]&&state==='battle')flight=!flight;keys.add(k)}window.addEventListener('keydown',e=>{if(state==='workshop')return;const k=normalize(e.key);if(['w','a','s','d',' ','f'].includes(k)){e.preventDefault();down(k)}});window.addEventListener('keyup',e=>keys.delete(normalize(e.key)));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key)});

let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(state==='workshop'){player.rotation.y+=dt*.55;renderer.render(scene,camera);return}let moving=false;if(state==='drop'||state==='battle'){let dx=Number(keys.has('d'))-Number(keys.has('a')),dz=Number(keys.has('w'))-Number(keys.has('s'));const len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;moving=!!(dx||dz);const speed=flight?24:state==='drop'?16:12;const nx=T.MathUtils.clamp(player.position.x-dx*speed*dt,-90,90),nz=T.MathUtils.clamp(player.position.z+dz*speed*dt,-90,90);if(state==='drop'||flight||walkable(nx,player.position.z))player.position.x=nx;if(state==='drop'||flight||walkable(player.position.x,nz))player.position.z=nz;if(moving)heading=Math.atan2(-dx,dz);player.rotation.y=heading;for(let i=0;i<limbs.length;i++)limbs[i].rotation.x=moving&&state==='battle'&&!flight?Math.sin(now*.012)*(i===0||i===3?1:-1)*.45:0;}
