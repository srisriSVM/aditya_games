<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Cube Dash</title><style>*{box-sizing:border-box}body{margin:0;background:#090d20;color:#f0f5ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:18px}a{color:#74efff}h1{font-size:clamp(30px,5vw,54px);margin:10px 0;font-style:italic}button{font:inherit;background:#202e53;color:#fff;border:1px solid #526897;border-radius:10px;padding:12px;cursor:pointer}button:hover,.active{background:#77f3ff;color:#101526}#levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:15px 0}#levels button{text-align:left}small{display:block;color:#afbdd8;margin-top:4px}.active small{color:#233853}#view{position:relative;overflow:hidden;border:1px solid #415c85;border-radius:14px;touch-action:none}canvas{width:100%;display:block;aspect-ratio: 16/9;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#090e20aa;text-align:center}#overlay div{background:#17213be8;border:1px solid #708bb5;border-radius:16px;padding:20px;max-width:90%}#overlay h2{margin:0 0 8px}#hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;margin:10px 0}#bar{height:8px;background:#263451;border-radius:10px;overflow:hidden;margin:10px 0}#fill{height:100%;width:0;background:#77f3ff}#bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}[hidden]{display:none!important}</style></head><body><main><a href="../../">← Arcade</a><h1>NEON <span style="color:#77f3ff">CUBE DASH</span></h1><div id="levels"></div><div id="hud"><span id="levelName"></span><span id="attempt"></span><span id="progress"></span></div><div id="bar"><div id="fill"></div></div><div id="view"><canvas id="canvas" width="960" height="540"></canvas><div id="overlay"><div><h2 id="title">Ready?</h2><p id="message">Jump over spikes and land on blocks!</p><button id="start">Play</button> <button id="next" hidden>Next level →</button></div></div></div><div id="bottom"><button id="jump">JUMP</button><button id="restart">Restart</button><button id="music">Music: ON</button><label>Cube color <input id="color" type="color" value="#72f5ff"></label></div><small>Space, Up arrow, W, click or tap to jump. Hold to keep jumping. R restarts.</small></main><script>
const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');const W=960,H=540,G=420,S=36;
const levels=[{name:'First Steps',difficulty:'Easy',speed:285,tint:'#37a8f5',groups:['s','s','b','s','ss','b','s','b','ss','s']},{name:'Neon Rush',difficulty:'Normal',speed:320,tint:'#a875ff',groups:['ss','b','s','bb','ss','p','s','ss','bb','p','ss','s']},{name:'Spike Storm',difficulty:'Hard',speed:355,tint:'#ff558d',groups:['ss','p','sss','bb','ss','p','sss','b','ss','bb','sss','p','ss']},{name:'Cyber Circuit',difficulty:'Expert',speed:385,tint:'#ffb342',groups:['sss','bb','p','sss','p','ss','bbb','sss','p','bb','sss','p','ss','sss']},{name:'Final Dimension',difficulty:'Extreme',speed:420,tint:'#45ef9d',groups:['sss','p','bbb','sss','bb','p','sss','p','bbb','sss','ss','p','sss','bb','sss','p']}];
let level=0,obstacles=[],end=0,x=120,y=G-S,vy=0,grounded=true,held=false,queued=false,rotation=0,mode='ready',attempt=0,particles=[],music=true,audio=null,timer=null,note=0,best={};try{best=JSON.parse(localStorage.getItem('neonCubeBest')||'{}')}catch{}
function build(){obstacles=[];let pos=460;const l=levels[level];for(const group of l.groups){if(group==='p'){obstacles.push({x:pos,w:72,h:45,type:'block'},{x:pos+110,w:36,h:34,type:'spike'});pos+=150}else{for(const ch of group){obstacles.push({x:pos,w:36,h:ch==='s'?37:48,type:ch==='s'?'spike':'block'});pos+=36}}pos+=Math.max(160, l.speed*.57)}end=pos+180}
function menu(){ $('levels').replaceChildren();levels.forEach((l,i)=>{const b=document.createElement('button');b.className=i===level?'active':'';const t=document.createElement('strong');t.textContent=(i+1)+'. '+l.name;const s=document.createElement('small');s.textContent=l.difficulty+' · Best '+(best[i]||0)+'%';b.append(t,s);b.onclick=()=>{level=i;attempt=0;ready()};$('levels').append(b)})}
function reset(){build();x=120;y=G-S;vy=0;grounded=true;rotation=0;queued=held=false;particles=[];$('levelName').textContent=levels[level].name;$('attempt').textContent='Attempt '+attempt;updateProgress(0)}
function ready(){stopMusic();mode='ready';reset();menu();$('overlay').hidden=false;$('title').textContent=levels[level].name;$('message').textContent='Jump over spikes and land on blocks. Reach 100%!';$('start').textContent='Play';$('next').hidden=true}
function start(){attempt++;reset();mode='run';$('overlay').hidden=true;startMusic()}
function updateProgress(p){$('progress').textContent=p+'%';$('fill').style.width=p+'%'}
function save(p){best[level]=Math.max(best[level]||0,p);try{localStorage.setItem('neonCubeBest',JSON.stringify(best))}catch{}}
function finish(win){if(mode!=='run')return;mode=win?'win':'dead';held=queued=false;stopMusic();const p=win?100:Math.floor((x-120)/(end-120)*100);save(p);menu();if(!win)for(let i=0;i<26;i++)particles.push({x:x+S/2,y:y+S/2,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,life:.7});$('overlay').hidden=false;$('title').textContent=win?'LEVEL COMPLETE!':'CRASH!';$('message').textContent=win?'100% · Great run!':'You reached '+p+'%. Try again!';$('start').textContent='Retry';$('next').hidden=!(win&&level<levels.length-1)}
function press(){if(mode==='run'){held=true;queued=true}else if(mode==='ready'||mode==='dead'){start()}}function release(){held=false}
window.addEventListener('keydown',e=>{if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();if(!e.repeat)press()}if(e.key.toLowerCase()==='r'){e.preventDefault();start()}});window.addEventListener('keyup',e=>{if([' ','ArrowUp','w','W'].includes(e.key))release()});window.addEventListener('blur',release);
for(const el of [cv,$('jump')]){el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);press()};el.onpointerup=el.onpointercancel=el.onlostpointercapture=release}
$('start').onclick=start;$('restart').onclick=start;$('next').onclick=()=>{level++;attempt=0;ready()};$('music').onclick=()=>{music=!music;$('music').textContent='Music: '+(music?'ON':'OFF');if(music&&mode==='run')startMusic();else stopMusic()};
function stopMusic(){if(timer!==null){clearInterval(timer);timer=null}}function startMusic(){if(!music||timer!==null)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const melody=[60,64,67,64,57,60,64,67,55,59,62,67,57,60,64,72];function beat(){if(audio.state!=='running')return;const t=audio.currentTime;function tone(f,v,len,type,fall){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(fall)o.frequency.exponentialRampToValueAtTime(fall,t+len);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len)}tone(440*2**((melody[note%16]-69)/12),.035,.17,'triangle');if(note%2===0)tone(110,.075,.14,'sine',42);if(note%4===2)tone(720,.017,.06,'square',200);note++}beat();timer=setInterval(beat,60000/(120+level*12)/2)}catch{}}
function physics(dt){if(mode!=='run')return;const speed=levels[level].speed;if((queued||held)&&grounded){vy=-640;grounded=false;queued=false}const oldY=y;x+=speed*dt;vy+=1850*dt;y+=vy*dt;grounded=false;if(y+S>=G&&vy>=0){y=G-S;vy=0;grounded=true}for(const o of obstacles){if(o.x>x+S||o.x+o.w<x)continue;const top=G-o.h;if(o.type==='block'){if(x+S-3>o.x&&x+3<o.x+o.w){if(vy>=0&&oldY+S<=top+3&&y+S>=top){y=top-S;vy=0;grounded=true}else if(y+S>top+3&&y<G-3){finish(false);return}}}else{const left=Math.max(x+6,o.x),right=Math.min(x+S-6,o.x+o.w);if(left<right&&y+S-5>top){const center=o.x+o.w/2,nearest=Math.max(left,Math.min(right,center)),surface=G-o.h*(1-Math.abs(nearest-center)/(o.w/2));if(y+S-5>surface+3&&y<G){finish(false);return}}}}if(grounded)rotation=Math.round(rotation/(Math.PI/2))*Math.PI/2;else rotation+=dt*7;const p=Math.min(100,Math.max(0,Math.floor((x-120)/(end-120)*100)));updateProgress(p);if(x>=end)finish(true)}
function draw(){const l=levels[level],cam=x-155;ctx.fillStyle='#10162e';ctx.fillRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,G);grad.addColorStop(0,'#11162d');grad.addColorStop(1,l.tint+'55');ctx.fillStyle=grad;ctx.fillRect(0,0,W,G);ctx.strokeStyle=l.tint+'25';ctx.lineWidth=1;for(let j=-1;j<15;j++){const xx=j*76-((cam*.35)%76);ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,G);ctx.stroke()}for(let yy=40;yy<G;yy+=76){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}ctx.fillStyle='#131d36';ctx.fillRect(0,G,W,H-G);ctx.strokeStyle=l.tint;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();ctx.strokeStyle=l.tint+'50';for(let j=-1;j<25;j++){const xx=j*48-(cam%48);ctx.strokeRect(xx,G+12,48,48)}for(const o of obstacles){const xx=o.x-cam;if(xx<-60||xx>W+60)continue;ctx.save();ctx.shadowColor=l.tint;ctx.shadowBlur=10;ctx.strokeStyle='#e9faff';ctx.lineWidth=2;ctx.fillStyle=l.tint+'bb';if(o.type==='spike'){ctx.beginPath();ctx.moveTo(xx,G);ctx.lineTo(xx+o.w/2,G-o.h);ctx.lineTo(xx+o.w,G);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.fillRect(xx,G-o.h,o.w,o.h);ctx.strokeRect(xx,G-o.h,o.w,o.h);ctx.strokeStyle='#ffffff66';ctx.strokeRect(xx+6,G-o.h+6,o.w-12,o.h-12)}ctx.restore()}const finishX=end-cam;if(finishX<W+100){ctx.strokeStyle='#83ffcf';ctx.lineWidth=7;ctx.strokeRect(finishX, G-135,42,135);ctx.fillStyle='#83ffcf';ctx.font='bold 16px system-ui';ctx.fillText('FINISH',finishX-7,G-148)}
if(mode!=='dead'){ctx.save();ctx.translate(x-cam+S/2,y+S/2);ctx.rotate(rotation);ctx.shadowColor=$('color').value;ctx.shadowBlur=18;ctx.fillStyle=$('color').value;ctx.fillRect(-S/2,-S/2,S,S);ctx.shadowBlur=0;ctx.strokeStyle='white';ctx.lineWidth=2;ctx.strokeRect(-S/2,-S/2,S,S);ctx.fillStyle='#10182a';ctx.fillRect(-11,-8,7,9);ctx.fillRect(4,-8,7,9);ctx.fillRect(-9,7,18,4);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=$('color').value;ctx.fillRect(p.x-cam,p.y,6,6)}ctx.globalAlpha=1}
let last=performance.now(),acc=0;function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;while(acc>=1/120){physics(1/120);acc-=1/120}for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(frame)}ready();requestAnimationFrame(frame);
</script></body></html>
