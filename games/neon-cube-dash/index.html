<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Cube Dash 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#090d20;color:#f0f5ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:18px}a{color:#74efff}h1{font-size:clamp(30px,5vw,54px);margin:10px 0;font-style:italic}button{font:inherit;background:#202e53;color:#fff;border:1px solid #526897;border-radius:10px;padding:12px;cursor:pointer}button:hover,.active{background:#77f3ff;color:#101526}#levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:15px 0}#levels button{text-align:left}small{display:block;color:#afbdd8;margin-top:4px}.active small{color:#233853}#view{position:relative;overflow:hidden;border:1px solid #415c85;border-radius:14px;touch-action:none}canvas{width:100%;display:block;aspect-ratio: 16/9;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#090e20aa;text-align:center}#overlay div{background:#17213be8;border:1px solid #708bb5;border-radius:16px;padding:20px;max-width:90%}#overlay h2{margin:0 0 8px}#hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;margin:10px 0}#bar{height:8px;background:#263451;border-radius:10px;overflow:hidden;margin:10px 0}#fill{height:100%;width:0;background:#77f3ff}#bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}[hidden]{display:none!important}</style></head><body><main><a href="../../">← Arcade</a><h1>NEON <span style="color:#77f3ff">CUBE DASH 3D</span></h1><div id="levels"></div><div id="hud"><span id="levelName"></span><span id="attempt"></span><span id="progress"></span></div><div id="bar"><div id="fill"></div></div><div id="view"><canvas id="canvas" width="960" height="540"></canvas><div id="overlay"><div><h2 id="title">Ready?</h2><p id="message">Jump over spikes and land on blocks!</p><button id="start">Play</button> <button id="next" hidden>Next level →</button></div></div></div><div id="bottom"><button id="jump">JUMP</button><button id="restart">Restart</button><button id="music">Music: ON</button><label>Soundtrack <input id="track" type="file" accept="audio/*"></label><button id="original">Default music</button><label>Cube color <input id="color" type="color" value="#72f5ff"></label></div><section style="margin:16px 0;padding:15px;border:1px solid #415c85;border-radius:12px"><strong>Custom scene builder</strong><div id="bottom"><label>Scene <select id="theme"><option>Neon city</option><option>Space</option><option>Volcano</option><option>Ice world</option><option>Custom color</option></select></label><label>Scene color <input type="color" id="themeColor" value="#a875ff"></label><button id="addSpike">+ Spike</button><button id="addBlock">+ Block</button><button id="addDouble">+ Double spike</button><button id="undo">Undo</button><button id="clear">Clear</button><button id="custom">Play custom level</button></div><p id="layoutPreview"></p></section><small>Space, Up arrow, W, click or tap to jump. Hold to keep jumping. R restarts.</small></main><script type="module">
const $=id=>document.getElementById(id),cv=$('canvas');const W=960,H=540,G=420,S=36;
const levels=[{name:'First Steps',difficulty:'Easy',speed:285,tint:'#37a8f5',groups:['s','s','b','s','ss','b','s','b','ss','s']},{name:'Neon Rush',difficulty:'Normal',speed:320,tint:'#a875ff',groups:['ss','b','s','bb','ss','p','s','ss','bb','p','ss','s']},{name:'Spike Storm',difficulty:'Hard',speed:355,tint:'#ff558d',groups:['ss','p','sss','bb','ss','p','sss','b','ss','bb','sss','p','ss']},{name:'Cyber Circuit',difficulty:'Expert',speed:385,tint:'#ffb342',groups:['sss','bb','p','sss','p','ss','bbb','sss','p','bb','sss','p','ss','sss']},{name:'Final Dimension',difficulty:'Extreme',speed:420,tint:'#45ef9d',groups:['sss','p','bbb','sss','bb','p','sss','p','bbb','sss','ss','p','sss','bb','sss','p']}];
let level=0,obstacles=[],end=0,x=120,y=G-S,vy=0,grounded=true,held=false,queued=false,rotation=0,mode='ready',attempt=0,particles=[],music=true,audio=null,timer=null,note=0,best={};try{best=JSON.parse(localStorage.getItem('neonCubeBest')||'{}')}catch{}
let customGroups=[];try{customGroups=JSON.parse(localStorage.getItem("cubeCustom")||"[]")}catch{}const customLevel={name:"My custom scene",difficulty:"Custom",speed:320,tint:"#a875ff",groups:customGroups};function edit(){customLevel.groups=customGroups;$("layoutPreview").textContent=customGroups.length?customGroups.map(g=>g==="b"?"■":g==="ss"?"▲▲":"▲").join("  "):"Add obstacles to build a level.";try{localStorage.setItem("cubeCustom",JSON.stringify(customGroups))}catch{}}$("addSpike").onclick=()=>{customGroups.push("s");edit()};$("addBlock").onclick=()=>{customGroups.push("b");edit()};$("addDouble").onclick=()=>{customGroups.push("ss");edit()};$("undo").onclick=()=>{customGroups.pop();edit()};$("clear").onclick=()=>{customGroups=[];edit()};$("custom").onclick=()=>{if(!customGroups.length){customGroups.push("s","b","ss");edit()}if(levels.length===5)levels.push(customLevel);level=5;attempt=0;ready()};edit();function build(){obstacles=[];let pos=460;const l=levels[level];for(const group of l.groups){if(group==='p'){obstacles.push({x:pos,w:72,h:45,type:'block'},{x:pos+110,w:36,h:34,type:'spike'});pos+=150}else{for(const ch of group){obstacles.push({x:pos,w:36,h:ch==='s'?37:48,type:ch==='s'?'spike':'block'});pos+=36}}pos+=Math.max(160, l.speed*.57)}end=pos+180}
function menu(){ $('levels').replaceChildren();levels.forEach((l,i)=>{const b=document.createElement('button');b.className=i===level?'active':'';const t=document.createElement('strong');t.textContent=(i+1)+'. '+l.name;const s=document.createElement('small');s.textContent=l.difficulty+' · Best '+(best[i]||0)+'%';b.append(t,s);b.onclick=()=>{level=i;attempt=0;ready()};$('levels').append(b)})}
function reset(){build();x=120;y=G-S;vy=0;grounded=true;rotation=0;queued=held=false;particles=[];$('levelName').textContent=levels[level].name;$('attempt').textContent='Attempt '+attempt;updateProgress(0)}
function ready(){stopMusic();mode='ready';reset();menu();$('overlay').hidden=false;$('title').textContent=levels[level].name;$('message').textContent='Jump over spikes and land on blocks. Reach 100%!';$('start').textContent='Play';$('next').hidden=true}
function start(){attempt++;reset();mode='run';$('overlay').hidden=true;startMusic()}
function updateProgress(p){$('progress').textContent=p+'%';$('fill').style.width=p+'%'}
function save(p){best[level]=Math.max(best[level]||0,p);try{localStorage.setItem('neonCubeBest',JSON.stringify(best))}catch{}}
function finish(win){if(mode!=='run')return;mode=win?'win':'dead';held=queued=false;stopMusic();const p=win?100:Math.floor((x-120)/(end-120)*100);save(p);menu();if(!win)for(let i=0;i<26;i++)particles.push({x:x+S/2,y:y+S/2,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,life:.7});$('overlay').hidden=false;$('title').textContent=win?'LEVEL COMPLETE!':'CRASH!';$('message').textContent=win?'100% · Great run!':'You reached '+p+'%. Try again!';$('start').textContent='Retry';$('next').hidden=!(win&&level<levels.length-1)}
function press(){if(mode==='run'){held=true;queued=true}else if(mode==='ready'||mode==='dead'){start()}}function release(){held=false}
window.addEventListener('keydown',e=>{if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();if(!e.repeat)press()}if(e.key.toLowerCase()==='r'){e.preventDefault();start()}});window.addEventListener('keyup',e=>{if([' ','ArrowUp','w','W'].includes(e.key))release()});window.addEventListener('blur',release);
for(const el of [cv,$('jump')]){el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);press()};el.onpointerup=el.onpointercancel=el.onlostpointercapture=release}
$('start').onclick=start;$('restart').onclick=start;$('next').onclick=()=>{level++;attempt=0;ready()};$('music').onclick=()=>{music=!music;$('music').textContent='Music: '+(music?'ON':'OFF');if(music&&mode==='run')startMusic();else stopMusic()};
let song=null,songURL=null;function stopMusic(){if(song){song.pause();song.currentTime=0;}if(timer!==null){clearInterval(timer);timer=null}}function startMusic(){if(!music||timer!==null)return;if(song){song.currentTime=0;song.play().catch(()=>{});return;}try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const melody=[60,64,67,64,57,60,64,67,55,59,62,67,57,60,64,72];function beat(){if(audio.state!=='running')return;const t=audio.currentTime;function tone(f,v,len,type,fall){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(fall)o.frequency.exponentialRampToValueAtTime(fall,t+len);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len)}tone(440*2**((melody[note%16]-69)/12),.035,.17,'triangle');if(note%2===0)tone(110,.075,.14,'sine',42);if(note%4===2)tone(720,.017,.06,'square',200);note++}beat();timer=setInterval(beat,60000/(120+level*12)/2)}catch{}}
$('track').onchange=()=>{const file=$('track').files[0];if(!file)return;stopMusic();if(songURL)URL.revokeObjectURL(songURL);songURL=URL.createObjectURL(file);song=new Audio(songURL);song.loop=true;song.volume=.55;if(mode==='run')startMusic()};$('original').onclick=()=>{stopMusic();song=null;if(songURL)URL.revokeObjectURL(songURL);songURL=null;$('track').value='';if(mode==='run')startMusic()};
function physics(dt){if(mode!=='run')return;const speed=levels[level].speed;if((queued||held)&&grounded){vy=-640;grounded=false;queued=false}const oldY=y;x+=speed*dt;vy+=1850*dt;y+=vy*dt;grounded=false;if(y+S>=G&&vy>=0){y=G-S;vy=0;grounded=true}for(const o of obstacles){if(o.x>x+S||o.x+o.w<x)continue;const top=G-o.h;if(o.type==='block'){if(x+S-3>o.x&&x+3<o.x+o.w){if(vy>=0&&oldY+S<=top+3&&y+S>=top){y=top-S;vy=0;grounded=true}else if(y+S>top+3&&y<G-3){finish(false);return}}}else{const left=Math.max(x+6,o.x),right=Math.min(x+S-6,o.x+o.w);if(left<right&&y+S-5>top){const center=o.x+o.w/2,nearest=Math.max(left,Math.min(right,center)),surface=G-o.h*(1-Math.abs(nearest-center)/(o.w/2));if(y+S-5>surface+3&&y<G){finish(false);return}}}}if(grounded)rotation=Math.round(rotation/(Math.PI/2))*Math.PI/2;else rotation+=dt*7;const p=Math.min(100,Math.max(0,Math.floor((x-120)/(end-120)*100)));updateProgress(p);if(x>=end)finish(true)}
let draw=()=>{};let graphicsOK=false;try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const renderer=new T.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(cv.clientWidth||960,(cv.clientWidth||960)*9/16,false);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,16/9,.1,130);scene.add(new T.HemisphereLight(0xe7faff,0x26336e,2));const light=new T.DirectionalLight(0xffffff,2.6);light.position.set(-4,8,6);scene.add(light);
const mat=(color,emissive=0)=>new T.MeshStandardMaterial({color,emissive:color,emissiveIntensity:emissive,roughness:.35});function obj(g,m,x=0,y=0,z=0,p=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o}
const stage=new T.Group(),scenery=new T.Group();scene.add(stage,scenery);const cube=new T.Group();scene.add(cube);const cubeMat=mat('#72f5ff',.22);obj(new T.BoxGeometry(1,1,1),cubeMat,0,0,0,cube);const face=mat(0x11182b);for(const xx of [-.22,.22])obj(new T.BoxGeometry(.17,.22,.025),face,xx,.15,.51,cube);obj(new T.BoxGeometry(.44,.1,.025),face,0,-.23,.51,cube);cube.add(new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1.02,1.02,1.02)),new T.LineBasicMaterial({color:0xffffff})));
const floorMat=mat(0x182441);const floor=obj(new T.BoxGeometry(60,.3,5),floorMat,12,-.15,0);const grid=new T.GridHelper(60,60,0x6684aa,0x324b77);grid.position.y=.015;scene.add(grid);const trail=[];for(let i=0;i<32;i++){const m=mat('#72f5ff',.35);m.transparent=true;const p=obj(new T.BoxGeometry(.16,.16,.16),m);p.visible=false;trail.push(p)}
const portal=new T.Group();scene.add(portal);obj(new T.TorusGeometry(1.4,.09,10,48),mat(0x72ffbd,.9),0,1.5,0,portal);portal.rotation.y=Math.PI/2;
let obstacleRef=null,obstacleMeshes=[],sceneKey="";function clearGroup(g){while(g.children.length){const o=g.children[0];g.remove(o);o.geometry.dispose();o.material.dispose()}}
function refresh(){clearGroup(stage);const l=levels[level];obstacleMeshes=obstacles.map(o=>{let g;if(o.type==='spike'){const shape=new T.Shape();shape.moveTo(-.5,0);shape.lineTo(.5,0);shape.lineTo(0,o.h/S);shape.closePath();g=new T.ExtrudeGeometry(shape,{depth:.95,bevelEnabled:false});g.translate(0,0,-.475)}else g=new T.BoxGeometry(o.w/S,o.h/S,.95);return obj(g,mat(l.tint,.24),0,o.type==='spike'?0:o.h/S/2,0,stage)});obstacleRef=obstacles}
function theme(){const t=$('theme').value,c=t==='Custom color'?$('themeColor').value:({'Neon city':levels[level].tint,'Space':'#6462ee','Volcano':'#ff5522','Ice world':'#70ddff'})[t],key=t+c;if(key===sceneKey)return;sceneKey=key;clearGroup(scenery);scene.background=new T.Color(c).multiplyScalar(.13);scene.fog=new T.Fog(scene.background,24,65);floorMat.color.set(c).multiplyScalar(.18);for(let i=0;i<26;i++){const x=i*3-25,z=-7-(i%4)*3;if(t==='Space'){const m=new T.MeshBasicMaterial({color:i%3?0xffffff:0x9bcbff});obj(new T.SphereGeometry(.08+(i%4)*.035,6,6),m,x,3+(i*7%11),z,scenery)}else if(t==='Volcano'||t==='Ice world'){const height=3+i%7;obj(new T.ConeGeometry(2,height,5),mat(c,.07),x,height/2,z,scenery)}else{const height=2+i*7%9;obj(new T.BoxGeometry(1.7,height,1.8),mat(c,.12),x,height/2,z,scenery)}}}
new ResizeObserver(()=>{const w=cv.clientWidth;if(w){renderer.setSize(w,w*9/16,false);camera.aspect=16/9;camera.updateProjectionMatrix()}}).observe(cv);
draw=()=>{if(obstacleRef!==obstacles)refresh();theme();const center=x/S;cube.position.set(0,(G-y-S/2)/S,0);cube.rotation.z=-rotation;cube.visible=mode!=='dead';cubeMat.color.set($('color').value);cubeMat.emissive.set($('color').value);obstacles.forEach((o,i)=>{const m=obstacleMeshes[i];m.position.x=(o.x+o.w/2)/S-center;m.visible=m.position.x>-12&&m.position.x<32});portal.position.x=end/S-center;grid.position.x=12-(center%1);scenery.position.x=-(center*.18%3);camera.position.set(5,7,16);camera.lookAt(8,1.6,0);for(let i=0;i<trail.length;i++){const p=trail[i],v=particles[i];if(v){p.visible=true;p.position.set(v.x/S-center,(G-v.y)/S,0);p.material.opacity=Math.max(0,v.life/.7);p.material.color.set($('color').value)}else p.visible=false}renderer.render(scene,camera)};graphicsOK=true;
}catch(e){console.error(e)}
let last=performance.now(),acc=0;function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;while(acc>=1/120){physics(1/120);acc-=1/120}for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(frame)}ready();if(graphicsOK)requestAnimationFrame(frame);else{$("message").textContent="3D graphics could not load. Reload with internet and WebGL enabled.";$("start").disabled=true}
</script></body></html>
